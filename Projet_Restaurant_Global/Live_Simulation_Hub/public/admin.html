<!DOCTYPE html>
<html lang="fr" data-theme="emerald-light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Engineer Burger | Console Admin & Direction</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-main: #F4F7F6;
      --surface-card: #FFFFFF;
      --border-card: #E2E8F0;
      --primary-accent: #059669;
      --primary-gold: #F59E0B;
      --accent-gradient: linear-gradient(135deg, #10B981 0%, #059669 100%);
      --gold-gradient: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
      --text-main: #0F172A;
      --text-muted: #64748B;
      --shadow-md: 0 8px 24px rgba(5, 150, 105, 0.08);
      --font-main: 'Outfit', sans-serif;
      --font-ar: 'Cairo', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header.admin-header {
      background: #FFFFFF;
      border-bottom: 2px solid var(--primary-accent);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand-group { display: flex; align-items: center; gap: 12px; }
    .brand-logo-img { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--primary-gold); object-fit: cover; }
    .brand-info h1 { font-size: 16.5px; font-weight: 900; }
    .brand-info p { font-size: 11px; color: var(--text-muted); }

    .admin-layout-flex {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .admin-sidebar {
      width: 220px;
      background: #0F172A;
      color: #FFF;
      display: flex;
      flex-direction: column;
      padding: 18px 10px;
      gap: 6px;
      flex-shrink: 0;
    }

    .sidebar-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 600;
      color: #94A3B8;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
    }
    .sidebar-btn:hover { background: rgba(255,255,255,0.08); color: #FFF; }
    .sidebar-btn.active { background: rgba(16,185,129,0.2); color: #34D399; font-weight: 800; border-left: 3px solid #10B981; }

    .admin-content-view {
      flex: 1;
      padding: 22px 28px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .card-module {
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--shadow-md);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .table-modern {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .table-modern th {
      background: #0F172A;
      color: #FFF;
      padding: 10px 12px;
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
    }

    .table-modern td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--border-card);
    }

    .btn-action-sm {
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-green { background: var(--accent-gradient); color: #FFF; }
    .btn-gold { background: var(--gold-gradient); color: #000; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="admin-header">
    <div class="brand-group">
      <img src="/logo.png" class="brand-logo-img">
      <div class="brand-info">
        <h1>The Engineer Burger &bull; Console Administrateur</h1>
        <p>14 Bd Sidi Yahia, Hydra, Alger &bull; Direction & Cuisine Live</p>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:10px;">
      <a href="/" style="background:#F1F5F9; border:1px solid #E2E8F0; padding:6px 14px; border-radius:20px; font-size:11.5px; font-weight:800; text-decoration:none; color:#0F172A;">
        🔀 Retour au Hub Live
      </a>
      <a href="/login" style="background:#0F172A; color:#FFF; padding:6px 14px; border-radius:20px; font-size:11.5px; font-weight:800; text-decoration:none;">
        🔒 Déconnexion Admin
      </a>
    </div>
  </header>

  <!-- Layout -->
  <div class="admin-layout-flex">
    
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <a href="javascript:void(0)" class="sidebar-btn active" onclick="switchAdminTab('dashboard', this)">
        <span>📊</span><span>Tableau de bord</span>
      </a>
      <a href="javascript:void(0)" class="sidebar-btn" onclick="switchAdminTab('orders', this)">
        <span>📋</span><span>Commandes Live</span>
      </a>
      <a href="javascript:void(0)" class="sidebar-btn" onclick="switchAdminTab('menu', this)">
        <span>🍔</span><span>Menu & Plats</span>
      </a>
      <a href="javascript:void(0)" class="sidebar-btn" onclick="switchAdminTab('ingredients', this)">
        <span>📦</span><span>Stock Ingrédients</span>
      </a>
      <a href="javascript:void(0)" class="sidebar-btn" onclick="switchAdminTab('drivers', this)">
        <span>🛵</span><span>Livreurs & Validation</span>
      </a>
      <a href="javascript:void(0)" class="sidebar-btn" onclick="switchAdminTab('customers', this)">
        <span>👥</span><span>Clients & Profils Détaillés</span>
      </a>
      <a href="javascript:void(0)" class="sidebar-btn" onclick="switchAdminTab('reports', this)">
        <span>📈</span><span>Rapports Financiers</span>
      </a>
    </aside>

    <!-- Main Content -->
    <main class="admin-content-view" id="adminContentBody"></main>

  </div>

  <script>
    let activeTab = 'dashboard';
    let appState = null;

    async function loadData() {
      try {
        const res = await fetch('/api/state');
        appState = await res.json();
        renderTab();
      } catch (e) {
        console.error(e);
      }
    }

    function switchAdminTab(tab, el) {
      activeTab = tab;
      document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
      if (el) el.classList.add('active');
      renderTab();
    }

    function renderTab() {
      const container = document.getElementById('adminContentBody');
      if (!appState) return;

      if (activeTab === 'customers') {
        container.innerHTML = `
          <div class="card-module">
            <div class="card-header">
              <h3 style="font-size:15px; font-weight:900;">👥 Base de Données Clients & Profils Complets (${appState.customers.length})</h3>
              <span style="font-size:11.5px; color:#059669; font-weight:800;">Synchronisation Supabase Active 🟢</span>
            </div>

            <table class="table-modern">
              <thead>
                <tr>
                  <th>Client</th>
                  <th>Téléphone</th>
                  <th>Âge</th>
                  <th>Date d'Inscription</th>
                  <th>Commandes</th>
                  <th>Total Dépensé (DA)</th>
                  <th>Points Fidélité</th>
                  <th>Adresses</th>
                  <th>Fiche</th>
                </tr>
              </thead>
              <tbody>
                ${appState.customers.map(c => `
                  <tr>
                    <td><strong>${c.name}</strong><br><span style="font-size:10px; color:#D97706; font-weight:800;">${c.membershipTier || 'Membre Gourmet'}</span></td>
                    <td>📞 ${c.phone}</td>
                    <td><strong>${c.age || 26} ans</strong></td>
                    <td>📅 ${c.registeredAt || '15 Janv 2026'}</td>
                    <td><strong>${c.totalOrders || 10}</strong> cmd</td>
                    <td><strong style="color:var(--primary-accent);">${(c.totalSpent || 25000).toLocaleString()} DA</strong></td>
                    <td><span style="background:#FEF3C7; color:#92400E; font-weight:900; padding:2px 8px; border-radius:6px;">⭐ ${c.loyaltyPoints} Pts</span></td>
                    <td style="font-size:10.5px; color:var(--text-muted);">📍 ${c.address}</td>
                    <td>
                      <button class="btn-action-sm btn-gold" onclick="alert('Fiche Complète :\\nNom : ${c.name}\\nTél : ${c.phone}\\nÂge : ${c.age || 26} ans\\nInscrit le : ${c.registeredAt}\\nTotal Dépensé : ${c.totalSpent} DA\\nFavoris : ${(c.favoriteItems||[]).join(', ')}')">
                        👁️ Voir Profil
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } else if (activeTab === 'dashboard') {
        container.innerHTML = `
          <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:14px;">
            <div class="card-module"><div style="font-size:11px; font-weight:800; color:var(--text-muted);">COMMANDES DU JOUR</div><div style="font-size:24px; font-weight:900; color:var(--primary-accent);">${appState.stats.todayOrders}</div></div>
            <div class="card-module"><div style="font-size:11px; font-weight:800; color:var(--text-muted);">EN COURS DE LIVRAISON</div><div style="font-size:24px; font-weight:900; color:#3B82F6;">${appState.stats.activeDeliveries}</div></div>
            <div class="card-module"><div style="font-size:11px; font-weight:800; color:var(--text-muted);">RECETTES AUJOURD'HUI</div><div style="font-size:24px; font-weight:900; color:#D97706;">${appState.stats.todayRevenue.toLocaleString()} DA</div></div>
            <div class="card-module"><div style="font-size:11px; font-weight:800; color:var(--text-muted);">COURSIERS DISPONIBLES</div><div style="font-size:24px; font-weight:900; color:#10B981;">${appState.drivers.filter(d=>d.status==='online').length}</div></div>
          </div>

          <div class="card-module">
            <div class="card-header"><h3 style="font-size:14.5px; font-weight:800;">📋 Commandes Récentes en Cuisine</h3></div>
            <table class="table-modern">
              <thead><tr><th>ID</th><th>Client</th><th>Plats</th><th>Total</th><th>Statut</th></tr></thead>
              <tbody>
                ${appState.orders.map(o => `
                  <tr>
                    <td><strong>${o.id}</strong></td>
                    <td>${o.customer_fr}</td>
                    <td>${o.items_fr}</td>
                    <td><strong>${o.total} DA</strong></td>
                    <td><span style="background:#ECFDF5; color:#059669; padding:2px 8px; border-radius:6px; font-weight:800;">${o.status_fr}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="card-module">
            <div class="card-header"><h3 style="font-size:15px; font-weight:800;">Section ${activeTab}</h3></div>
            <p style="font-size:12px; color:var(--text-muted);">Gestion complète connectée avec synchronisation WebSocket.</p>
          </div>
        `;
      }
    }

    window.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
